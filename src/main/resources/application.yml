spring:
  application:
    name: rpa-test-automation
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rpa_test_automation}
    username: ${DB_USER:rpa_test}
    password: ${DB_PASSWORD:rpa_test}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  mvc:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: true
    certificate: ${SSL_CERTIFICATE:}
    certificate-private-key: ${SSL_CERTIFICATE_PRIVATE_KEY:}
    compression:
      enabled: true
      mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
auth:
  jwt:
    # HS256 ключ подписи — минимум 32 байта, иначе JwtService откажет при старте (см. ADR 0003).
    # Как и с orchestrator.credentials, реальное значение — ТОЛЬКО через переменную окружения в
    # проде/стейджинге, дефолт годится лишь для локальной разработки.
    secret: ${AUTH_JWT_SECRET:local-dev-only-change-me-32-bytes-minimum}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cookies:
    # Secure-кука браузер не отправит обратно без HTTPS — см. HTTPS_SETUP.md. false — ТОЛЬКО для
    # локальной разработки без TLS, никогда в проде/стейджинге (ADR 0004).
    secure: ${AUTH_COOKIES_SECURE:true}
  bootstrap-admin:
    # Первый ADMIN создаётся при старте, если app_user пуста (см. AdminBootstrapRunner). Пустой
    # пароль — бутстрап пропускается (в лог уходит предупреждение), войти будет некому.
    username: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

orchestrator:
  base-url: ${ORCHESTRATOR_BASE_URL:http://localhost:8090}
  credentials:
    username: ${ORCHESTRATOR_USERNAME:}
    password: ${ORCHESTRATOR_PASSWORD:}
  # Таймауты одного HTTP-вызова к оркестратору (сетевой уровень, не ожидание шага) — явные и
  # видимые здесь, не скрытые в коде.
  http:
    connect-timeout: 5s
    read-timeout: 30s
  # Только интервал опроса. Таймаут ОЖИДАНИЯ шага глобально не задаётся (ADR 0005): его можно
  # указать лишь в конфиге шага сценария — JOB: config.timeoutSeconds, QUEUE_CHECK:
  # config.timeoutSeconds. Не указан — шаг ждёт без ограничения по времени.
  polling:
    interval: 5s
  queue-check-polling:
    interval: 5s
  # Минимум свободных (Idle) роботов на оркестраторе, при котором POST .../run вообще стартует
  # прогон — иначе 409 CONFLICT, не имеет смысла ставить задание в очередь заведомо без роботов.
  min-free-robots: ${ORCHESTRATOR_MIN_FREE_ROBOTS:2}
  # orchestrator.tls.trusted-certificates: сертификаты CA оркестратора, если он поднят за
  # внутренним/самоподписанным CA (иначе PKIX path building failed при HTTPS-подключении).
  # Не задан по умолчанию (используется системный truststore JDK как есть). Задаётся через env:
  # ORCHESTRATOR_TLS_TRUSTED_CERTIFICATES=file:C:/certs/CA.crt,file:C:/certs/CA_2.crt

resilience4j:
  retry:
    instances:
      orchestrator-read:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
      orchestrator-write:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      orchestrator:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5

execution:
  async:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # INFO: каждая значимая операция (создание/поиск очереди, старт задания, каждая попытка
    # поллинга — статус задания и проверки очереди). DEBUG (com.rpatest.execution.engine) — ещё
    # подробнее, но по сути дублирует то, что уже видно в detail шага через GET /api/v1/runs/{id}.
    com.rpatest: INFO

jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    # Реальный пароль шифрования секретов передаётся ТОЛЬКО через переменную окружения
    # JASYPT_ENCRYPTOR_PASSWORD в проде/стейджинге, значение по умолчанию годится лишь для локальной разработки.
    password: ${JASYPT_ENCRYPTOR_PASSWORD:local-dev-only-change-me}
